<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QORVIAN quick add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090D}
a{color:#C8F25A;text-decoration:none}a:hover{color:#E2FF8F}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0E13;color:#EEF2F6;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden">

<div aria-hidden="true" style="padding:22px 20px;opacity:0.35;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:34px;height:34px;border-radius:11px;background:#C8F25A"></div>
    <span style="font-size:17px;font-weight:700;letter-spacing:0.08em">QORVIAN</span>
  </div>
  <div style="height:120px;border-radius:24px;background:#151A21"></div>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(5,7,10,0.6)"></div>

<section aria-label="Add expense" style="position:absolute;left:0;right:0;bottom:0;height:770px;box-sizing:border-box;background:#151A21;border-top:1px solid #262D37;border-radius:28px 28px 0 0;padding:10px 20px 22px;display:flex;flex-direction:column;gap:14px">
  <div style="width:40px;height:5px;border-radius:999px;background:#3A4352;align-self:center"></div>

  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2 style="margin:0;font-size:19px;font-weight:700">Add expense</h2>
    <a href="Main.dc.html" aria-label="Close" style="width:44px;height:44px;border-radius:50%;background:#1C222B;color:#EEF2F6;display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px;align-items:center;background:#0F1318;border:1px solid #232A33;border-radius:22px;padding:16px">
    <label for="item" style="font-size:12px;color:#8C97A6">Item</label>
    <input id="item" value="vada pav" style="background:transparent;border:0;outline:none;text-align:center;color:#EEF2F6;font:inherit;font-size:17px;font-weight:600;width:100%">
    <label for="amount" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Amount in rupees</label>
    <div style="display:flex;align-items:baseline;justify-content:center;gap:2px">
      <span style="font-size:30px;font-weight:600;color:#8C97A6">₹</span>
      <input id="amount" class="num" value="20" inputmode="decimal" style="background:transparent;border:0;outline:none;color:#EEF2F6;font:inherit;font-size:52px;font-weight:700;width:110px;text-align:left">
    </div>
    <span style="font-size:12px;color:#8C97A6">Last time: ₹20 · food · UPI</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:13px;color:#8C97A6">Category</span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button style="height:36px;padding:0 14px;border-radius:999px;border:1px solid {{c.border}};background:{{c.bg}};color:{{c.ink}};font:inherit;font-size:13px;font-weight:{{c.w}};cursor:pointer">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:13px;color:#8C97A6">Paid with</span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{pays}}" as="p" hint-placeholder-count="5">
        <button style="height:36px;padding:0 14px;border-radius:999px;border:1px solid {{p.border}};background:{{p.bg}};color:{{p.ink}};font:inherit;font-size:13px;font-weight:{{p.w}};cursor:pointer">{{p.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;background:#0F1318;border:1px solid #232A33;border-radius:18px;padding:0 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;min-height:50px;border-bottom:1px solid #232A33">
      <span style="font-size:14px">Time</span>
      <button style="height:32px;padding:0 12px;border-radius:10px;border:1px solid #2A323D;background:#1C222B;color:#EEF2F6;font:inherit;font-size:13px;cursor:pointer">Now · 8:14 pm</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;min-height:50px;gap:12px">
      <span style="font-size:14px">Counts toward day-to-day budget</span>
      <button aria-label="Counts toward day-to-day budget: on" style="width:48px;height:28px;border-radius:999px;border:0;background:#C8F25A;position:relative;flex-shrink:0;cursor:pointer">
        <span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#0B0E13"></span>
      </button>
    </div>
  </div>

  <button style="margin-top:auto;height:54px;border-radius:18px;border:0;background:#C8F25A;color:#0B0E13;font:inherit;font-size:16px;font-weight:700;cursor:pointer">Save ₹20</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (label, on) => on
      ? { label, bg: '#C8F25A', ink: '#0B0E13', border: '#C8F25A', w: 600 }
      : { label, bg: '#1C222B', ink: '#EEF2F6', border: '#2A323D', w: 400 };
    return {
      cats: [pill('food', true), pill('groceries'), pill('transport'), pill('shopping'), pill('health'), pill('entertainment'), pill('other')],
      pays: [pill('UPI', true), pill('Slice'), pill('SBI Cashback'), pill('HDFC Moneyback'), pill('Cash')]
    };
  }
}
</script>
</body>
</html>
