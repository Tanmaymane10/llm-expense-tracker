[project]
name = "gpprac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanmay Mane", email = "tanmaymane18@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
    "pandas>=2.3.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.scripts]
gpprac = "gpprac:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

