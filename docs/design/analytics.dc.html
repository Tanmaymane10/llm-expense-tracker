<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QORVIAN analytics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090D}
a{color:#C8F25A;text-decoration:none}a:hover{color:#E2FF8F}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width:390px;height:1240px;box-sizing:border-box;background:#0B0E13;color:#EEF2F6;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden">
<div style="padding:22px 20px 120px;display:flex;flex-direction:column;gap:18px">

  <h1 style="margin:0;font-size:26px;font-weight:700">Analytics</h1>

  <div role="group" aria-label="Period" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#151A21;border:1px solid #232A33;border-radius:16px;padding:4px">
    <button style="height:38px;border-radius:12px;border:0;background:#2A323D;color:#EEF2F6;font:inherit;font-size:13px;font-weight:600;cursor:pointer">Month</button>
    <button style="height:38px;border-radius:12px;border:0;background:transparent;color:#8C97A6;font:inherit;font-size:13px;cursor:pointer">30 days</button>
    <button style="height:38px;border-radius:12px;border:0;background:transparent;color:#8C97A6;font:inherit;font-size:13px;cursor:pointer">90 days</button>
    <button style="height:38px;border-radius:12px;border:0;background:transparent;color:#8C97A6;font:inherit;font-size:13px;cursor:pointer">Custom</button>
  </div>

  <section aria-label="Daily spending" style="background:#151A21;border:1px solid #232A33;border-radius:24px;padding:18px 18px 12px;display:flex;flex-direction:column;gap:10px">
    <span style="font-size:13px;color:#8C97A6">Day-to-day, 1–26 Nov</span>
    <div style="display:flex;align-items:baseline;gap:10px">
      <span class="num" style="font-size:32px;font-weight:700">₹6,240</span>
      <span class="num" style="font-size:13px;color:#FF9A9A">▲ ₹1,180 vs same days in Oct</span>
    </div>
    <svg viewBox="0 0 352 130" width="352" height="130" role="img" aria-label="Daily spending line for November with a 7-day average">
      <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8F25A" stop-opacity="0.28"></stop><stop offset="1" stop-color="#C8F25A" stop-opacity="0"></stop></linearGradient></defs>
      <path d="M0 96 L14 88 L28 100 L42 70 L56 92 L70 84 L84 60 L98 94 L112 86 L126 98 L140 52 L154 80 L168 90 L182 76 L196 99 L210 84 L224 40 L238 88 L252 78 L266 92 L280 66 L294 22 L308 84 L322 74 L336 58 L350 80 L350 130 L0 130 Z" fill="url(#fill)"></path>
      <path d="M0 96 L14 88 L28 100 L42 70 L56 92 L70 84 L84 60 L98 94 L112 86 L126 98 L140 52 L154 80 L168 90 L182 76 L196 99 L210 84 L224 40 L238 88 L252 78 L266 92 L280 66 L294 22 L308 84 L322 74 L336 58 L350 80" fill="none" stroke="#C8F25A" stroke-width="2.2" stroke-linejoin="round"></path>
      <path d="M0 90 L56 88 L112 84 L168 82 L224 78 L280 74 L350 70" fill="none" stroke="#8C97A6" stroke-width="1.6" stroke-dasharray="4 4"></path>
      <circle cx="294" cy="22" r="4.5" fill="#0B0E13" stroke="#C8F25A" stroke-width="2"></circle>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#8C97A6"><span>1 Nov</span><span>Biggest day: Sun 22, ₹1,288</span><span>26 Nov</span></div>
  </section>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <div style="background:#151A21;border:1px solid #232A33;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
      <span style="font-size:12px;color:#8C97A6">Average per day</span>
      <span class="num" style="font-size:22px;font-weight:700">₹240</span>
    </div>
    <div style="background:#151A21;border:1px solid #232A33;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
      <span style="font-size:12px;color:#8C97A6">Weekend vs weekday</span>
      <span class="num" style="font-size:22px;font-weight:700">₹410 / ₹172</span>
    </div>
  </div>

  <section aria-label="Categories against budget" style="background:#151A21;border:1px solid #232A33;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0;font-size:17px;font-weight:600">Where it went</h2>
      <span style="font-size:12px;color:#8C97A6">vs budget</span>
    </div>
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:14px">
          <span style="font-weight:500">{{c.name}}</span>
          <span class="num"><b style="color:{{c.ink}}">{{c.spent}}</b> <span style="color:#8C97A6">{{c.of}}</span></span>
        </div>
        <div style="height:8px;border-radius:999px;background:#232A33">
          <div style="height:8px;border-radius:999px;width:{{c.pct}};background:{{c.bar}}"></div>
        </div>
      </div>
    </sc-for>
  </section>

  <section aria-label="By card" style="background:#151A21;border:1px solid #232A33;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px">
    <h2 style="margin:0;font-size:17px;font-weight:600">By payment method</h2>
    <sc-for list="{{pays}}" as="p" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:10px;font-size:14px">
        <span style="width:10px;height:10px;border-radius:3px;background:{{p.color}};flex-shrink:0"></span>
        <span style="flex-grow:1">{{p.name}}</span>
        <span class="num" style="color:#8C97A6;font-size:12px">{{p.share}}</span>
        <span class="num" style="font-weight:600;min-width:64px;text-align:right">{{p.amt}}</span>
      </div>
    </sc-for>
  </section>
</div>

<nav aria-label="Main" style="position:absolute;left:12px;right:12px;bottom:16px;height:72px;border-radius:24px;background:rgba(21,26,33,0.94);border:1px solid #262D37;display:flex;align-items:center;justify-content:space-around">
  <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#8C97A6;font-size:11px;min-width:52px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Home</a>
  <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#C8F25A;font-size:11px;min-width:52px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Analytics</a>
  <a href="QuickAdd.dc.html" aria-label="Add expense" style="width:56px;height:56px;border-radius:50%;background:#C8F25A;color:#0B0E13;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 8px 24px rgba(200,242,90,0.28)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
  <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#8C97A6;font-size:11px;min-width:52px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Plan</a>
  <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#8C97A6;font-size:11px;min-width:52px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>Usage</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const cat = (name, spent, of, pct, state) => ({
      name, spent, of, pct,
      bar: state === 'over' ? '#FF7A7A' : state === 'near' ? '#F5B84B' : '#C8F25A',
      ink: state === 'over' ? '#FF9A9A' : '#EEF2F6'
    });
    return {
      cats: [
        cat('food', '₹4,696', 'of ₹4,000', '100%', 'over'),
        cat('shopping', '₹754', 'of ₹1,000', '75%', 'ok'),
        cat('transport', '₹416', 'of ₹500', '83%', 'near'),
        cat('groceries', '₹344', 'of ₹800', '43%', 'ok'),
        cat('health', '₹30', 'no budget', '3%', 'ok')
      ],
      pays: [
        { name: 'UPI', amt: '₹2,060', share: '33%', color: '#C8F25A' },
        { name: 'HDFC Moneyback', amt: '₹2,898', share: '46%', color: '#6FB7F2' },
        { name: 'Slice', amt: '₹654', share: '11%', color: '#8B7CF6' },
        { name: 'SBI Cashback', amt: '₹628', share: '10%', color: '#4A5566' }
      ]
    };
  }
}
</script>
</body>
</html>
