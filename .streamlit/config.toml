[theme]
base = "dark"
primaryColor = "#C8F25A"  # = --accent in app.py THEME_CSS
backgroundColor = "#0B0E13"
secondaryBackgroundColor = "#151A21"
textColor = "#EEF2F6"
borderColor = "#232A33"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseRadius = "large"

[client]
# Hides the Deploy button and developer menu for visitors of the public site.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
