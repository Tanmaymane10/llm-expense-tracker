[theme]
base = "dark"
primaryColor = "#6fd9c4"  # = --accent in app.py THEME_CSS
backgroundColor = "#06150f"
secondaryBackgroundColor = "#0c241c"
textColor = "#dbe9e2"
font = "sans serif"
baseRadius = "large"

[client]
# Hides the Deploy button and developer menu for visitors of the public site.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false